<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>htnml Events </title>
</head>
<body style="background-color: #414141; color: aliceblue;">
    <h2>Amazing image</h2>
    <div >
        <ul id="images">
            <li><img width="200px" id="photoshop" src="https://images.pexels.com/photos/3561339/pexels-photo-3561339.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt="photoshop"></li>
            <li><img width="200px" id="japan" src="https://images.pexels.com/photos/3532553/pexels-photo-3532553.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><img width="200px" id="river" src="https://images.pexels.com/photos/3532551/pexels-photo-3532551.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><img width="200px" id="owl" src="https://images.pexels.com/photos/3532552/pexels-photo-3532552.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><img width="200px" id="prayer" src="https://images.pexels.com/photos/2522671/pexels-photo-2522671.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><a style="color: aliceblue;" href="https://google.com" id="google">Google</a></li>
        </ul>
   </div>
</body>
<script>


/* learn more about      
 attachEvent()
      jQuery - on

     type, timestamp, defaultPrevented
      target, toElement, srcElement, currentTarget,
      clientX, clientY, screenX, screenY
       altkey, ctrlkey, shiftkey, keyCode

    */

document.getElementById('images').addEventListener('click',function(elem){
  console.log("image clicked");
},false);

document.getElementById('owl').addEventListener('click',function(elem){
       console.log("owl clicked")
}, false )       // this false is called event bubbling ... ehy bydefault hi false hundy pur kety kety ehnu true ve krna pendaa hai .... jithe appa ehnu true krde haa ohnu event capturing kehndy hai....
// capturing jandy top too bottom  ..... Bubbling jandy bottom to top   // output => owl clicked
//    image clicked

// ehnu sare bubbling nu ty capturing nu kehnde hai evebr propogation ehnu top wale side ty jaan too roak lyi use krdy aa    elem.stopPropagation;

document.getElementById('owl').addEventListener('click', function(elem){
    console.log("owl clicked");
    elem.stopPropagation();   // ✅ brackets zaroori hain
}, true); 


document.getElementById('google').addEventListener('click', function(elem){
   elem.preventDefault();  // hun anchor ty tap krn nal google nhi khulugaa....
   elem.stopPropagation();
console.log("google clicked");
})


document.querySelector('#images').addEventListener('click',function(elem){


if(elem.target.tagName === 'IMG'){
const removeIt = elem.target.parentNode;
      console.log(elem.target.tagName);  // jehde jehde img ty ya list ty click kryga ohda tag name show krugaa.....
     removeIt.remove();    // for removing images .....
}

      
})

</script>  
</html>
