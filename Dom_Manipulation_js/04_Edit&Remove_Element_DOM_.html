<ul class="point">

<script>

function set(user){

const li = document.createElement(`li`)
li.innerHTML=`${user}`
const mylist = document.querySelector(`.point`)
mylist.appendChild(li)

}
set(`hello`)
set(`java user`)


// ********************************** Optimized way *************************************

// ess vich jo li use ho rhy ty jo upar hoya sii dona da block scope alag alag hai dona da ek dujy nal koi lena dena nhi ...

function user(para){
const li = document.createElement(`li`)
li.appendChild(document.createTextNode(para))  
document.querySelector(`.point`).appendChild(li)
}
